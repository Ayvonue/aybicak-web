# Tam self-host kurulum: tek VPS'te tüm sistem.
# Kullanım: docker compose up -d
# İlk açılışta şema otomatik uygulanır (db/schema.sql init olarak bağlı).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news-dev-password}
      POSTGRES_DB: news_terminal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_terminal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: ["npm", "run", "start"]
    environment: &app-env
      DATABASE_URL: postgresql://news:${POSTGRES_PASSWORD:-news-dev-password}@postgres:5432/news_terminal
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET zorunlu}
      NEWS_API_SHARED_KEY: ${NEWS_API_SHARED_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      GATEWAY_METRICS_URL: http://gateway:3312/metrics
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3312/v1/stream}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build: .
    command: ["npm", "run", "ws:gateway"]
    environment: *app-env
    ports:
      - "3312:3312"
    depends_on:
      redis:
        condition: service_healthy

  ingest:
    build: .
    command: ["npm", "run", "ingest:watch"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ticker:
    build: .
    command: ["npm", "run", "ticker:watch"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
